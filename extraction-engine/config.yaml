# Extraction engine configuration.
#
# Provider is normally set by the application via the EXTRACTION_PROVIDER env var
# (which overrides this file): PROD -> openrouter, DEV -> ollama. This file's
# `provider` is only the fallback when no env var is set.
#
# Product providers: openrouter (cloud) and ollama (local). 'stub' exists for
# the offline test suite only and is never offered as a product provider.
extraction:
  # Fallback when EXTRACTION_PROVIDER is unset. openrouter | ollama
  provider: openrouter

  # Rows whose confidence is below this are flagged for user review in the UI.
  low_confidence_threshold: 0.80

  providers:
    openrouter:
      model: google/gemini-2.5-flash
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      max_image_px: 1600
      timeout_seconds: 120
      # TLS: by default verification uses the OS trust store (truststore), which
      # includes corporate roots from the macOS Keychain — handles proxies that
      # inject a self-signed root. To override, set ca_bundle to a PEM file, or
      # verify_ssl: false as a last resort (disables verification).
      # ca_bundle: /path/to/corporate-root.pem
      # verify_ssl: false

    ollama:
      model: qwen2.5vl:7b
      host: http://localhost:11434
      timeout_seconds: 300

    # stub: test-only (offline). No configuration needed.
